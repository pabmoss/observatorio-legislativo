name: Recopilar y publicar Observatorio Legislativo

on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'index.html'
      - 'assets/**'
      - 'herramientas/**'
      - 'requirements.txt'
      - '.github/workflows/publicar.yml'
      - 'documentos/**'
  schedule:
    # GitHub Actions ejecuta lo antes posible, no garantiza el minuto exacto.
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: observatorio-legislativo
  cancel-in-progress: false

jobs:
  recopilar-y-compilar:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt
      - name: Ejecutar pruebas del monitor
        run: python -m unittest discover -s tests -v
      - name: Detectar novedades oficiales (sin interpretar decisiones jurídicas)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python herramientas/recopilar_novedades.py
      - name: Regenerar fichas Word y datos de consulta
        run: |
          python herramientas/generar_documentos.py
          python herramientas/generar_plenarias.py
          python herramientas/compilar_datos.py
          python herramientas/recopilar_novedades.py --compilar
      - name: Guardar estado de consulta en el repositorio
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "observatorio-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/novedades.json data/novedades.js data/estado_fuentes.json data/estado_fuentes.js data/sesiones.json data/sesiones.js documentos/sesiones/
          if ! git diff --cached --quiet; then
            git commit -m "Monitoreo de publicaciones oficiales [skip ci]"
            git push origin HEAD:main
          fi
      - name: Preparar sitio estático
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -R assets data documentos _site/
          touch _site/.nojekyll
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Subir sitio compilado
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  publicar:
    needs: recopilar-y-compilar
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
